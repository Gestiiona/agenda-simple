services:
  agendasimple:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Contraseña del administrador (mínimo 8 caracteres). Cámbiala.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
    volumes:
      # Tus datos viven aquí y sobreviven a reinicios y actualizaciones
      - agendasimple-data:/app/data

volumes:
  agendasimple-data:
